name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: ツールのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck shfmt

      - name: shellcheck
        run: shellcheck -s bash gcloud-ps1.sh test/run.sh test/cases.sh

      - name: shfmt
        run: shfmt -d gcloud-ps1.sh test/run.sh test/cases.sh

      - name: テスト (bash / zsh)
        run: test/run.sh

  # 履歴全体に秘密情報 (トークンや鍵) が混ざっていないかを調べる
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        run: >
          docker run --rm -v "$PWD":/repo:ro ghcr.io/gitleaks/gitleaks:v8.30.1
          git --log-opts="--all" --redact --no-banner /repo

  # 古い bash (macOS 標準の 3.2 など) でも動くことを、公式イメージで確かめる
  old-bash:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bash: ["3.2", "4.4"]
    steps:
      - uses: actions/checkout@v7

      - name: テスト (bash ${{ matrix.bash }})
        run: docker run --rm -v "$PWD":/src:ro "bash:${{ matrix.bash }}" bash /src/test/run.sh
